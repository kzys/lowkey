[main]
# Cozette (a bitmap font) required installing a font file outside this repo
# with no guarantee it'd still be there; an absolute path to a font already
# bundled with the OS (here, ScummVM's) keeps this config self-contained,
# and it's the same font Terminal.sh points lowkey at.
font=/usr/config/scummvm/themes/themes/fonts/GoMono-Regular.ttf:pixelsize=13
# The DSI panel reports 75 DPI, which rescales the requested pixel size and
# blurs it. Ask for exact pixels instead.
dpi-aware=no

[key-bindings]
# lowkey's R1 chord sends bare Page_Up/Page_Down (R1 is the modifier), not
# Shift+Page_Up/Shift+Page_Down.
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
